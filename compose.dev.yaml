# Override khusus development lokal untuk mengakses service db dari host.
# Jangan dipakai untuk deployment penuh; gunakan bersama compose.yaml:
#   docker compose -p sbs-dev -f compose.yaml -f compose.dev.yaml up -d db
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - dev_local
      - internal

networks:
  dev_local:
    driver: bridge
